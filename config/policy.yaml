# ============================================================================
# mcp-netproxy Behavioral State-Machine Policy
# ============================================================================
# Defines the DFA state space for Zero Trust enforcement of MCP tool calls.
# Compatible with @modelcontextprotocol/server-filesystem and server-fetch.
# ============================================================================

# ----------------------------------------------------------------------------
# Backend registry
# ----------------------------------------------------------------------------
# Each key is a backend namespace ([a-z][a-z0-9]*).  Every tool the backend
# advertises is exposed to clients as "<namespace>__<tool>" (e.g.
# fs__read_file) and evaluated by the DFA under that namespaced name.
# Bare names (read_file) remain callable while exactly one backend serves
# them; a bare name shared by several backends is rejected as ambiguous.
#
#   url             JSON-RPC endpoint (overridden by the url_env variable)
#   capabilities    DFA states the backend may expose; discovered tools
#                   classified outside this set are quarantined as UNKNOWN
#   sandbox_roots   prefixes that every path argument must stay within
#   path_arguments  argument names (string or list) checked against roots
#   scan_responses  run the ingest scanner on LOCAL_READ/UNTRUSTED_INGEST/
#                   NETWORK_EGRESS responses (sticky taint on injection directives)
#   url_arguments   argument names checked against egress (default: [url])
#   egress          outbound URL policy: schemes, exact-host allowlist, and
#                   private_hosts (allowlisted hosts that may resolve to
#                   private addresses).  Loopback, link-local and metadata
#                   addresses are always refused.  Also enforced on every
#                   request (incl. redirects) by the egress guard.
#   tools           explicit upstream tool name -> DFA state mappings
default_backend: fs

backends:
  fs:  # @modelcontextprotocol/server-filesystem
    url: http://unprotected:9000/mcp
    url_env: MCP_FILESYSTEM_URL
    capabilities: [DISCOVERY, LOCAL_READ, LOCAL_WRITE]
    sandbox_roots:
      - /mcp-proxy-testbed/sandbox
      - /sandbox
    path_arguments: [path, paths, source, destination]
    scan_responses: true
    tools:
      list_allowed_directories: DISCOVERY
      list_directory: DISCOVERY
      list_directory_with_sizes: DISCOVERY
      directory_tree: DISCOVERY
      search_files: DISCOVERY
      read_file: LOCAL_READ
      read_text_file: LOCAL_READ
      read_media_file: LOCAL_READ
      read_multiple_files: LOCAL_READ
      get_file_info: LOCAL_READ
      write_file: LOCAL_WRITE
      edit_file: LOCAL_WRITE
      create_directory: LOCAL_WRITE
      move_file: LOCAL_WRITE

  web:  # mcp-server-fetch
    url: http://fetch-backend:9001/mcp
    url_env: MCP_FETCH_URL
    capabilities: [LOCAL_READ, NETWORK_EGRESS, UNTRUSTED_INGEST]
    scan_responses: true
    egress:
      schemes: [http, https]
      allowed_hosts:
        - fetch-backend      # testbed fixture server
      private_hosts:
        - fetch-backend      # internal Docker address
    tools:
      # Outbound request: the URL itself can carry data off-host, so fetch
      # is egress.  Its response is still external content and is scanned;
      # taint is applied by the ingest scanner rather than on every fetch.
      fetch: NETWORK_EGRESS

# ----------------------------------------------------------------------------
# Global tool mappings
# ----------------------------------------------------------------------------
# Un-namespaced mappings for tools not owned by a registered backend.  These
# route to default_backend and always take precedence over bare aliases.
tool_mappings:
  # Discovery tools
  list_tools: DISCOVERY

  # Untrusted external data ingestion (unconditional static taint)
  browser_action: UNTRUSTED_INGEST
  web_search: UNTRUSTED_INGEST
  scrape_url: UNTRUSTED_INGEST

  # Privileged execution
  execute_command: EXECUTE
  bash: EXECUTE
  run_script: EXECUTE

  # Network egress (data exfiltration surface)
  send_webhook: NETWORK_EGRESS
  upload_file: NETWORK_EGRESS
  send_email: NETWORK_EGRESS

# ----------------------------------------------------------------------------
# Layer 1 argument limits (rejected before forwarding)
# ----------------------------------------------------------------------------
# Arguments must be an object; path/URL arguments must be strings (or lists
# of strings); values must match the tool's inputSchema types once the proxy
# has seen it via tools/list.
argument_limits:
  max_path_length: 4096       # PATH_MAX
  max_url_length: 8192
  max_total_bytes: 1048576    # serialized arguments, 1 MiB

# Directed edges in the DFA.  from_state -> [to_states]
# Any transition NOT listed here is denied by default.
allowed_transitions:
  START:
    - DISCOVERY
    - LOCAL_READ
    - LOCAL_WRITE  # writing first is a normal session (create, rename, generate)
    - UNTRUSTED_INGEST

  DISCOVERY:
    - DISCOVERY
    - LOCAL_READ
    - LOCAL_WRITE
    - EXECUTE
    - UNTRUSTED_INGEST
    - NETWORK_EGRESS

  LOCAL_READ:
    - LOCAL_READ
    - LOCAL_WRITE
    - EXECUTE
    - DISCOVERY
    - UNTRUSTED_INGEST
    - NETWORK_EGRESS

  LOCAL_WRITE:
    - DISCOVERY
    - LOCAL_READ
    - LOCAL_WRITE
    - EXECUTE

  UNTRUSTED_INGEST:
    - DISCOVERY
    - LOCAL_READ
    # Note: LOCAL_WRITE, EXECUTE, and NETWORK_EGRESS are deliberately
    # omitted here to block indirect prompt injection at the transition
    # layer. The forbidden_invariants below provide a second explicit
    # enforcement layer with detailed audit reasons.

  EXECUTE:
    - DISCOVERY
    - LOCAL_READ
    - LOCAL_WRITE
    - EXECUTE

  NETWORK_EGRESS:
    - DISCOVERY
    - LOCAL_READ

# Invariant rules that trigger fatal violations regardless of allowed_transitions.
# These model hard security boundaries against indirect prompt injection.
forbidden_invariants:
  - from_state: UNTRUSTED_INGEST
    to_state: LOCAL_WRITE
    reason: >-
      Untrusted ingestion cannot directly mutate local files
      (mitigating indirect prompt injection).
    unless_visited: []

  - from_state: UNTRUSTED_INGEST
    to_state: EXECUTE
    reason: >-
      Untrusted ingestion cannot trigger command execution
      (mitigating confused deputy).
    unless_visited: []

  - from_state: UNTRUSTED_INGEST
    to_state: NETWORK_EGRESS
    reason: >-
      Untrusted ingestion cannot exfiltrate data over external
      network.
    unless_visited: []
