services:
  protected:
    container_name: mcp-protected
    build: .
    ports:
      - "8000:8000"
    environment:
      - MCP_BACKEND_URL=http://unprotected:9000/mcp
      - MCP_FILESYSTEM_URL=http://unprotected:9000/mcp
      - MCP_FETCH_URL=http://fetch-backend:9001/mcp
      - POLICY_PATH=/app/config/policy.yaml
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config:/app/config:ro
      # Same path the filesystem backend serves, read-only, so the sandbox
      # check can resolve symlinks exactly as the backend will.
      - .:/mcp-proxy-testbed:ro
    depends_on:
      - unprotected
      - fetch-backend

  unprotected:
    container_name: mcp-unprotected
    build: ./mcp-filesystem-backend
    ports:
      - "9000:9000"
    volumes:
      - .:/mcp-proxy-testbed

  fetch-backend:
    container_name: mcp-fetch-backend
    build: ./mcp-fetch-backend
    ports:
      - "9001:9001"
    volumes:
      - .:/mcp-proxy-testbed