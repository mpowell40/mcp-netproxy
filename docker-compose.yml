services:
  proxy:
    container_name: mcp-protected-proxy
    build: .
    ports:
      - "8000:8000"
    environment:
      - MCP_BACKEND_URL=http://mock-mcp:9000/mcp
      - POLICY_PATH=/app/config/policy.yaml
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - mock-mcp

  mock-mcp:
    container_name: mcp-unprotected-direct
    build: ./mock-mcp
    ports:
      - "9000:9000"
    volumes:
      - .:/mcp-proxy-testbed